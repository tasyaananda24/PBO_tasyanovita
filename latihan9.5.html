<html>

<head>
    <title>Ordered List</title>
</head>

<body>
    <h1><b><u>Ordered List</u></b></h1>
    Nama Mata Kuliah:
    <hr width="25%" align="left" size="5" color="red">

    <ol type="1"> <!-- menampilkan list bernomor -->
        <li>Algoritme dan Pemrograman</li>
        <li>Pengenalan Web</li>
        <li>Pakar Program Naga</li>
        <li>Project</li>
    </ol>

    Nama Haris:

    <ol> <!-- menampilkan list bernomor -->
        <li>Senin</li>
        <li>Selasa</li>
        <li>Rabu</li>
        <li>Kamis</li>
    </ol>

    Nama Bulan:
    <ol type="I"> <!-- menampilkan list dengan angka Romawi -->
        <li>Januari</li>
        <li>Februari</li>
        <li>Maret</li>
        <li>April</li>
    </ol>

    Nama Kota:
    <ol type="a"> <!-- menampilkan list abjad kecil -->
        <li>Subang</li>
        <li>Bandung</li>
        <li>Cirebon</li>
    </ol>
</body>

</html>
